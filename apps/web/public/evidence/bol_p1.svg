  <text x="55" y="190" fill="#f87171" font-family="monospace" font-size="13" font-weight="bold">CHECK-OUT: 12:10 PM</text>
  <text x="55" y="215" fill="#f8fafc" font-family="monospace" font-size="12">TOTAL ON-SITE: 4.5 HOURS</text>
  <rect x="315" y="110" width="245" height="120" fill="#0f172a" rx="8" stroke="#10b981"/>
