<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Tracker</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --line: #e4e4e0; --text: #1c1c1a; --muted: #6b6b66; --faint: #9a9a94;
    --intake: #2563eb; --data: #059669; --enrich: #d97706; --brief: #7c3aed; --bad: #dc2626; --ok: #059669;
    --chip: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --panel: #1b1b19; --line: #2c2c29; --text: #ecece8; --muted: #a3a39c; --faint: #6f6f69;
      --intake: #60a5fa; --data: #34d399; --enrich: #fbbf24; --brief: #a78bfa; --bad: #f87171; --ok: #34d399;
      --chip: #252522;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  h1 { margin: 0; font-size: 16px; }
  .conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.down { background: var(--bad); }
  main { padding: 16px 20px 40px; max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
  h2 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .agents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .agent { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 12px; min-height: 118px; }
  .agent .name { font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .agent .role { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .agent .now { margin-top: 10px; font-size: 13px; min-height: 2.8em; overflow-wrap: anywhere; }
  .agent .count { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .state { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .state.busy { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .panel .head span { color: var(--faint); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; background: var(--panel); position: sticky; top: 0; }
  td.file { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .scroll { max-height: 62vh; overflow: auto; }
  .steps { display: flex; gap: 4px; flex-wrap: wrap; }
  .step { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--chip); color: var(--faint); white-space: nowrap; }
  .step.on { color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); font-weight: 600; }
  .step.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); font-weight: 600; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .log li { list-style: none; padding: 7px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 62px 1fr; gap: 8px; }
  .log ul { margin: 0; padding: 0; }
  .log time { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .who { font-weight: 600; color: var(--c); }
  .arrow { color: var(--faint); }
  .topic { font-family: ui-monospace, monospace; font-size: 11px; color: var(--faint); }
  .msg { overflow-wrap: anywhere; }
  .empty { padding: 18px 12px; color: var(--faint); }
  .muted { color: var(--muted); }
  @media (max-width: 900px) { .agents { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } .agents { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Agent Tracker</h1>
  <div class="conn"><span id="dot" class="dot"></span><span id="conn">connecting…</span></div>
</header>
<main>
  <section>
    <h2>Who is doing what</h2>
    <div class="agents" id="agents"></div>
  </section>
  <div class="grid2">
    <section class="panel">
      <div class="head"><h2 style="margin:0">Incoming data</h2><span id="docCount">0 files</span></div>
      <div class="scroll">
        <table>
          <thead><tr><th>File</th><th>Type / reference</th><th>Progress</th><th>Filed on</th></tr></thead>
          <tbody id="docs"><tr><td colspan="4" class="empty">Waiting for paperwork… upload a file or replay a demo day.</td></tr></tbody>
        </table>
      </div>
    </section>
    <section class="panel log">
      <div class="head"><h2 style="margin:0">Raw message feed</h2><span id="msgCount">0 messages</span></div>
      <div class="scroll"><ul id="log"></ul></div>
    </section>
  </div>
</main>
<script>
// Feed is relative so this page works at :4100/tracker and behind the UI's /inference proxy.
const AGENTS = {
  'intake-agent':     { name: 'Intake Agent',     role: 'Reads each file with OpenAI vision', c: 'var(--intake)' },
  'data-server':      { name: 'Data Server',      role: 'Files docs on Terse load actors, runs the audit', c: 'var(--data)' },
  'enrichment-agent': { name: 'Enrichment Agent', role: 'Pulls outside data (EIA diesel)', c: 'var(--enrich)' },
  'briefer':          { name: 'Briefer',          role: 'Writes the owner’s nightly text', c: 'var(--brief)' },
}
const agentOf = id => AGENTS[id] ? id : id.startsWith('company:') ? 'data-server' : null
const label = id => AGENTS[agentOf(id)]?.name ?? (id.startsWith('owner:') ? 'Owner' : id === 'ui' ? 'Owner app' : id === 'openai' ? 'OpenAI' : id)
const base = p => String(p ?? '').split('/').pop()
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const usd = n => '$' + Number(n ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
const time = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' }).replace(/ [AP]M$/, '')

const seen = new Set()
const docs = new Map()           // traceId|file -> { file, kind, ref, stage, loads, matchedBy, at }
const status = {}                // agent -> { now, busy, count }
for (const k of Object.keys(AGENTS)) status[k] = { now: 'Idle', busy: false, count: 0 }
const open = { enrich: new Set(), brief: new Set() }
let total = 0

function describe(m) {
  const p = m.payload ?? {}
  switch (m.topic) {
    case 'log': return p.reading ? `Reading ${base(p.reading)} with OpenAI…` : JSON.stringify(p)
    case 'doc.extracted': return `Extracted ${base(p.doc?.file)} → ${String(p.doc?.kind).replace(/_/g, ' ')}${p.doc?.reference ? ` (ref ${p.doc.reference})` : ''}${p.cached ? ' · from cache' : ''}`
    case 'load.updated': return p.loadIds?.length ? `Filed ${base(p.file)} on ${p.loadIds.join(', ')} (${p.matchedBy})` : `No load matched for ${base(p.file)} (${p.matchedBy})`
    case 'findings.ready': return `Audit for ${p.asOf}: ${p.findings?.length ?? 0} findings, ${usd(p.totalAtRisk)} at risk`
    case 'enrichment.requested': return `Asked for outside data for ${p.asOf}`
    case 'enrichment': return `Diesel ${p.diesel?.period}: $${Number(p.diesel?.pricePerGallon).toFixed(3)}/gal (${p.diesel?.source})`
    case 'briefing.ready': return `Sent owner text: “${String(p.text ?? '').split('\n')[0]}”`
    default: return m.topic
  }
}

function track(m) {
  const p = m.payload ?? {}
  const a = agentOf(m.from)
  if (a) { status[a].count++; status[a].now = describe(m); status[a].busy = false }
  const key = m.traceId ?? (p.doc?.file ?? p.file ?? p.reading)
  const doc = f => { const k = key ?? f; if (!docs.has(k)) docs.set(k, { file: f, stage: 'received', at: m.at }); return docs.get(k) }
  if (m.topic === 'log' && p.reading) { const d = doc(p.reading); d.stage = 'reading'; status['intake-agent'].busy = true }
  if (m.topic === 'doc.extracted') {
    const d = doc(p.doc?.file); d.kind = p.doc?.kind; d.ref = p.doc?.reference; d.cached = p.cached
    if (d.stage !== 'filed' && d.stage !== 'unmatched') d.stage = 'extracted'
    status['data-server'].busy = true; status['data-server'].now = `Filing ${base(p.doc?.file)}…`
  }
  if (m.topic === 'load.updated') {
    const d = doc(p.file); d.kind ??= p.kind; d.loads = p.loadIds ?? []; d.matchedBy = p.matchedBy
    d.stage = d.loads.length || /fleet|message/.test(p.matchedBy ?? '') ? 'filed' : 'unmatched'
  }
  if (m.topic === 'findings.ready') { open.brief.add(m.id); status.briefer.busy = true; status.briefer.now = `Writing briefing: ${p.findings?.length ?? 0} findings, ${usd(p.totalAtRisk)}` }
  if (m.topic === 'enrichment.requested') { open.enrich.add(m.id); status['enrichment-agent'].busy = true; status['enrichment-agent'].now = 'Fetching diesel price…' }
  if (m.topic === 'enrichment') open.enrich.clear()
  if (m.topic === 'briefing.ready') open.brief.clear()
  if (open.brief.size) status.briefer.busy = true
  if (open.enrich.size) status['enrichment-agent'].busy = true
}

function renderAgents() {
  document.getElementById('agents').innerHTML = Object.entries(AGENTS).map(([id, a]) => {
    const s = status[id]
    return `<div class="agent" style="--c:${a.c}">
      <div class="name">${a.name}<span class="state ${s.busy ? 'busy pulse' : ''}">${s.busy ? 'working' : 'idle'}</span></div>
      <div class="role">${a.role}</div>
      <div class="now">${esc(s.now)}</div>
      <div class="count">${s.count} messages sent</div></div>`
  }).join('')
}

const STEPS = [['received', 'Received', 'var(--intake)'], ['reading', 'Reading', 'var(--intake)'], ['extracted', 'Extracted', 'var(--intake)'], ['filed', 'Filed', 'var(--data)']]
const ORDER = { received: 0, reading: 1, extracted: 2, filed: 3, unmatched: 3 }
function renderDocs() {
  const rows = [...docs.values()].reverse()
  document.getElementById('docCount').textContent = `${rows.length} files · ${rows.filter(d => d.stage === 'filed').length} filed · ${rows.filter(d => d.stage === 'unmatched').length} unmatched`
  if (!rows.length) return
  document.getElementById('docs').innerHTML = rows.map(d => {
    const at = ORDER[d.stage]
    const steps = STEPS.map(([k, l, c], i) => {
      if (i === 3 && d.stage === 'unmatched') return `<span class="step bad">Unmatched</span>`
      const cls = i <= at ? 'on' : ''
      const live = i === at && d.stage !== 'filed' ? 'pulse' : ''
      return (i === 1 && d.cached) ? `<span class="step on" style="--c:${c}">Cached</span>` : `<span class="step ${cls} ${live}" style="--c:${c}">${l}</span>`
    }).join('')
    return `<tr><td class="file">${esc(base(d.file))}</td>
      <td>${esc((d.kind ?? '—').replace(/_/g, ' '))}${d.ref ? `<div class="muted">${esc(d.ref)}</div>` : ''}</td>
      <td><div class="steps">${steps}</div></td>
      <td>${d.loads?.length ? esc(d.loads.join(', ')) : d.matchedBy ? `<span class="muted">${esc(d.matchedBy)}</span>` : '—'}</td></tr>`
  }).join('')
}

const logEl = document.getElementById('log')
function renderMsg(m) {
  const a = agentOf(m.from)
  const li = document.createElement('li')
  li.innerHTML = `<time>${time(m.at)}</time><div>
    <span class="who" style="--c:${a ? AGENTS[a].c : 'var(--muted)'}">${esc(label(m.from))}</span>
    <span class="arrow">→</span> ${esc(label(m.to))} <span class="topic">${esc(m.topic)}</span>
    <div class="msg">${esc(describe(m))}</div></div>`
  logEl.prepend(li)
  while (logEl.children.length > 400) logEl.lastChild.remove()
  document.getElementById('msgCount').textContent = `${++total} messages`
}

let pending = false
function onMessage(m) {
  if (seen.has(m.id)) return
  seen.add(m.id)
  track(m); renderMsg(m)
  if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; renderAgents(); renderDocs() }) }
}

function connect() {
  const es = new EventSource('relay/feed')
  const dot = document.getElementById('dot'), conn = document.getElementById('conn')
  es.onopen = () => { dot.className = 'dot live'; conn.textContent = 'live' }
  es.onerror = () => { dot.className = 'dot down'; conn.textContent = 'reconnecting…' }
  es.onmessage = e => { try { onMessage(JSON.parse(e.data)) } catch {} }
}
// Backfill the last 200 messages, then stream.
fetch('relay/recent').then(r => r.json()).then(ms => ms.forEach(onMessage)).catch(() => {}).finally(connect)
renderAgents()
</script>
</body>
</html>
